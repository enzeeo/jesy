[project]
name = "disaster-response"
version = "0.1.0"
description = "Disaster response coordination system (hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.50",
    "sse-starlette>=2.1",
    "tenacity>=9.0",
    "snowflake-connector-python>=3.12",
    "ortools>=9.11",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "anyio>=4.6",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",        # bugbear
    "BLE",      # blind-except (P1 #5)
    "ASYNC",
    "RUF",
    "UP",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["src/disaster"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
